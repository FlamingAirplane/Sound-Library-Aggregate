name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sounds-of-babel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund --legacy-peer-deps
      - name: Prepare static build
        run: |
          rm -rf app/api
          sed -i "/export const dynamic = 'force-dynamic'/d" app/layout.tsx
      - name: Build
        env:
          NEXT_OUTPUT_MODE: export
          NEXT_PUBLIC_STATIC_SITE: '1'
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npx next build
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sounds-of-babel/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
